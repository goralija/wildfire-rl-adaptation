name: Core tests
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  core:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m unittest discover -s tests -v
        env:
          PYTHONPATH: src
      - run: python -m wildfire_rl.cli --config configs/smoke.json --out runs/ci-smoke
        env:
          PYTHONPATH: src
  numeric:
    # NumPy/geo/Gymnasium tests that skip in `core`. SimFire (Python 3.9 runtime) and
    # sb3/torch stay out, so only those tests and tests needing local data may skip.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements/ci-numeric.txt
      - run: python -m pip install --only-binary ':all:' -r requirements/ci-numeric.txt
      - run: python -m pip list
      - name: Unit tests
        shell: bash
        run: python -m unittest discover -s tests -v 2>&1 | tee unittest.log
        env:
          PYTHONPATH: src
          MPLBACKEND: Agg
          SDL_VIDEODRIVER: dummy
      - name: Skipped tests
        if: always()
        shell: bash
        run: |
          grep -E "\.\.\. skipped" unittest.log > skipped.log || true
          echo "Skipped tests: $(wc -l < skipped.log)"
          cat skipped.log
          allowed="optional RL extra not installed|No module named 'simfire|local FEDS/gridMET inputs are not available"
          if grep -vE "$allowed" skipped.log; then
            echo "::error::The tests above skipped for a reason other than SimFire, the RL extra or local data."
            exit 1
          fi
      - run: python -m wildfire_rl.cli --config configs/smoke.json --out runs/ci-smoke
        env:
          PYTHONPATH: src
  knowledge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -r requirements/knowledge.txt
      - run: python -m unittest discover -s tests/knowledge -v
      - run: python scripts/validate_knowledge.py --strict
