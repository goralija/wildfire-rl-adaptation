# Small parse-time defaults for the pinned SimFire 2.0.1 integration.
# The smoke runner replaces dimensions, fuel, terrain, wind and start state
# with the verified FEDS/LANDFIRE inputs before constructing FireSimulation.
area:
  screen_size: [12, 12]
  pixel_scale: 590.5511811

display:
  fire_size: 1
  control_line_size: 1
  agent_size: 1

simulation:
  update_rate: 1
  runtime: 48h
  headless: true
  draw_spread_graph: false
  record: false
  save_data: false
  data_type: npy
  sf_home: .local/simfire-runs

mitigation:
  ros_attenuation: true

operational:
  seed:
  latitude: 37.65
  longitude: -108.47
  height: 2160
  width: 2160
  resolution: 180
  year: 2020

terrain:
  topography:
    type: functional
    functional:
      function: flat
      flat: {}
      perlin:
        octaves: 3
        persistence: 0.7
        lacunarity: 2.0
        seed: 827
        range_min: 100.0
        range_max: 300.0
      gaussian:
        amplitude: 500
        mu_x: 50
        mu_y: 50
        sigma_x: 50
        sigma_y: 50
  fuel:
    type: functional
    functional:
      function: chaparral
      chaparral:
        seed: 1113

fire:
  fire_initial_position:
    type: static
    static:
      position: [0, 0]
    random:
      seed: 8888
  # SimFire expresses cell lifetime in minute updates. Scale its 15-update
  # 30 m demo default by the 180/30 cell-width ratio for this strategy grid.
  max_fire_duration: 90
  diagonal_spread: true

environment:
  moisture: 0.03

wind:
  function: simple
  cfd:
    time_to_train: 1000
    iterations: 1
    scale: 1
    timestep_dt: 1.0
    diffusion: 0.0
    viscosity: 0.0000001
    speed: 19
    direction: north
  simple:
    speed: 7.0
    direction: 90.0
  perlin:
    speed:
      seed: 2345
      scale: 400
      octaves: 3
      persistence: 0.7
      lacunarity: 2.0
      range_min: 7
      range_max: 47
    direction:
      seed: 650
      scale: 1500
      octaves: 2
      persistence: 0.9
      lacunarity: 1.0
      range_min: 0.0
      range_max: 360.0
